name: build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DesktopAgent.sln

      - name: Build Debug
        run: dotnet build DesktopAgent.sln --configuration Debug --no-restore

      - name: Build Release
        run: dotnet build DesktopAgent.sln --configuration Release --no-restore

      - name: Test Release with hang diagnostics
        run: >-
          dotnet test tests/DesktopAgent.Tests/DesktopAgent.Tests.csproj
          --configuration Release
          --no-build
          --results-directory TestResults
          --logger "trx;LogFileName=DesktopAgent.Tests.trx"
          --diag TestResults/vstest-diag.log
          --blame-hang
          --blame-hang-timeout 2m
          --blame-hang-dump-type mini

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: TestResults/**
          if-no-files-found: ignore
          retention-days: 7
