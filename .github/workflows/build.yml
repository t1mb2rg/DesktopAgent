name: build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore DesktopAgent.sln

      - name: Build
        run: dotnet build DesktopAgent.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/DesktopAgent.Tests/DesktopAgent.Tests.csproj --configuration Release --no-build
