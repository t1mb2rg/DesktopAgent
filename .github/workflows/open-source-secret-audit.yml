name: open-source-secret-audit

# One-time publication gate: verify history reachable from every branch and tag.
# Never publish the JSON report or matching excerpts: this is a private-to-public transition.
on:
  pull_request:
    paths:
      - '.github/workflows/open-source-secret-audit.yml'
      - 'tools/security/**'
      - 'docs/security/**'
      - 'docs/experiments/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  all-refs-gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout complete Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch all branch and tag refs
        shell: bash
        run: |
          git fetch --force --prune origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*'
          echo "Scanning all fetched branches and tags (not just the PR diff)."
          git for-each-ref --format='%(refname)' refs/remotes/origin refs/tags | wc -l

      - name: Install pinned Gitleaks CLI
        shell: bash
        run: |
          version='8.30.1'
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" version

      - name: Check all reachable Git history (do not print matches)
        shell: bash
        run: |
          # Avoid printing potentially private filenames and credentials to Actions logs.
          # Do not upload scan output as an artifact; Actions logs become public when repo does.
          set +e
          "$RUNNER_TEMP/gitleaks" git \
            --log-opts='--all' \
            --redact=100 \
            --report-format=json \
            --report-path="$RUNNER_TEMP/all-refs-gitleaks.json" \
            . > "$RUNNER_TEMP/gitleaks-private.log" 2>&1
          code=$?
          set -e
          if [[ "$code" == "1" ]]; then
            echo '::error title=Publication audit blocked::Potential secret matches exist in reachable Git history. Run tools/security/invoke-secret-audit.ps1 locally to review the redacted report. No matches are printed to CI.'
            exit 1
          fi
          if [[ "$code" != "0" ]]; then
            echo "::error title=Publication audit failed::Gitleaks could not finish (exit code $code). Do not interpret this as a pass."
            exit "$code"
          fi
          echo 'Gitleaks passed for all fetched branch/tag histories. Other publication checks still required.'
